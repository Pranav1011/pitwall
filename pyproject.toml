[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall"
version = "0.1.0"
description = "F1 tyre-degradation modelling and Monte-Carlo pit-strategy simulation"
requires-python = ">=3.10"
dependencies = [
    "fastf1",
    "statsmodels",
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*rank-deficient.*:UserWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
